name: medidor_hapinet_app
description: "Medidor Hapinet App - Gestión de abonados y lectura de medidores"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 3.0.0

environment:
  sdk: ^3.7.2


dependencies:
  flutter:
    sdk: flutter

  # para conectar con API REST
  http: ^1.2.0
  
  flutter_dotenv: ^5.2.1
  
  # Cámara
  camera: ^0.10.5+9
 
  # OCR offline - Google ML Kit (sin internet)
  google_mlkit_text_recognition: ^0.13.0
 
  # Base de datos local (ORM sobre SQLite)
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
 
  # Geolocalización
  geolocator: ^12.0.0

  # Mapa offline
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  flutter_map_cache: ^1.2.0
  dio_cache_interceptor: ^3.5.0
  dio_cache_interceptor_file_store: ^1.2.2
  dio: ^5.7.0
  # Permisos en runtime
  permission_handler: ^11.3.1
 
  # Utilidades
  path_provider: ^2.1.3
  path: ^1.9.0
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.3.2

  #Para generar en excel
  excel: ^4.0.6
  #para generar un zip(este caso con el excel e imagenes)
  archive: ^3.6.1
  #guardar archivos en celular
  share_plus: ^10.0.0
  #Para generar PDF
  pdf: ^3.10.8
  printing: ^5.9.0

  #Para Speech-to-Text
  #speech_to_text: ^7.0.0

  flutter_sound: ^9.2.13
  whisper_flutter_new: ^1.0.1

  #Para reproducir videos
  video_player: ^2.9.2
  chewie: ^1.8.5
  flutter_pdfview: ^1.4.4

  #Para manejar el blueetho de la impresora
  flutter_bluetooth_printer: ^2.24.0
 
dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/hapinet_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#E3F2FD"
  adaptive_icon_foreground: "assets/images/hapinet_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_hapinet.jpeg
    - assets/images/logo_hapinet.png
    - assets/images/hapinet_icon.png
    - .env